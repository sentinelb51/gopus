# Compiles the vendored libopus on every target the module claims to support.
#
# macos-latest is the reason this exists: it is arm64, and the only runner that
# ever compiles simd_arm64.c and dnn_arm64.c. Neon intrinsics that do not build
# are invisible from a Windows or Linux amd64 machine.

name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go build -v ./...

      - run: go vet ./...
